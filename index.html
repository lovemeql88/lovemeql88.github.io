<style>
:root{
 --bg:#050509;--panel:#0d0d14;--line:#393946;--gold:#f0bd4e;--gold2:#fff1ad;
 --purple:#7b4dff;--purple2:#c39cff;--muted:#9899aa;--text:#f7f5ef;--danger:#c84b62;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08090d;color:var(--text);font-family:Georgia,"Times New Roman",serif}
body{overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:
radial-gradient(circle at 50% 18%,rgba(123,77,255,.24),transparent 24%),
radial-gradient(circle at 15% 75%,rgba(240,189,78,.08),transparent 20%),
radial-gradient(circle at 85% 65%,rgba(123,77,255,.10),transparent 22%),
linear-gradient(135deg,#040407,#0b0812 45%,#040407);z-index:-2}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;z-index:-1;
background-image:radial-gradient(rgba(255,255,255,.18) .6px,transparent .7px);background-size:5px 5px}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;z-index:-1;
background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px),
repeating-linear-gradient(90deg,transparent 0 5px,rgba(255,255,255,.018) 6px)}
.app{width:min(1440px,96vw);margin:auto;padding:28px 0 55px}
header{text-align:center;margin-bottom:28px}
.kicker{font:900 11px Arial,sans-serif;letter-spacing:5px;color:var(--gold);text-transform:uppercase}
h1{font-family:Arial,sans-serif;font-size:clamp(34px,6vw,78px);line-height:.92;margin:9px 0 12px;
font-weight:1000;letter-spacing:-3px;text-shadow:0 0 35px rgba(123,77,255,.28),0 5px 22px #000}
.subtitle{font:700 12px Arial,sans-serif;color:#b2b3c0;letter-spacing:1.5px}
.stage{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:stretch}
.main{position:relative;min-height:730px;border:1px solid #34313f;background:
linear-gradient(180deg,rgba(21,18,30,.96),rgba(7,7,12,.98));box-shadow:0 30px 100px #000,0 0 80px rgba(123,77,255,.06);
overflow:hidden}
.main:before,.main:after{content:"";position:absolute;inset:10px;border:1px solid #ffffff0b;pointer-events:none}
.wheel-area{position:relative;min-height:650px;display:grid;place-items:center;padding:25px}
canvas{width:min(680px,78vw);height:min(680px,78vw);max-width:680px;max-height:680px;display:block;filter:drop-shadow(0 28px 40px #000)}
.pointer{position:absolute;top:29px;left:50%;transform:translateX(-50%);z-index:4;
width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:40px solid var(--gold);
filter:drop-shadow(0 0 8px #000)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:118px;height:118px;
border-radius:50%;border:3px solid var(--gold);background:#0b0c10;box-shadow:0 0 0 8px #0b0c10,0 0 35px #000;

.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 20px 22px}
button{font:900 14px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;border:1px solid #75602f;
background:linear-gradient(135deg,#f5d77d,#b57a24);color:#171109;padding:15px 27px;cursor:pointer;min-width:210px;
box-shadow:inset 0 1px #fff8,0 7px 20px #0007}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}button:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed;transform:none}
button.secondary{background:#161922;color:#d6d9df;border-color:#3c414c;min-width:150px}
.status{text-align:center;font:12px Arial,sans-serif;color:var(--muted);padding-bottom:25px}
.status strong{color:var(--gold)}
.side{border:1px solid #34313f;background:linear-gradient(180deg,#14111c,#09090e);padding:16px;

.side h2{font-size:18px;margin:0 0 6px}
.side .small{font:11px Arial,sans-serif;color:#747b88;margin-bottom:15px}
.list{display:grid;gap:8px;max-height:680px;overflow:auto;padding-right:4px}
.card{display:flex;align-items:center;justify-content:center;padding:3px;border:1px solid #252a34;background:#11141a;transition:.25s;width:50px;height:50px}
.card img{width:42px;height:42px;object-fit:cover;object-position:center;border:1px solid #555;border-radius:3px}
.card .name{font:700 12px Arial,sans-serif;line-height:1.15}.card .desc{display:none!important}
.card.out{opacity:.22;filter:grayscale(1);text-decoration:line-through}.card.final{border-color:var(--gold);box-shadow:0 0 18px #bd8f3a33}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;z-index:50;

.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(2,3,6,.88);backdrop-filter:blur(12px);
display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:.25s}
.overlay.show{opacity:1;visibility:visible}
.reveal{width:min(760px,94vw);padding:24px;background:linear-gradient(145deg,#191c25,#08090d);
border:1px solid #66532c;box-shadow:0 35px 100px #000;transform:scale(.72);transition:.55s cubic-bezier(.18,.9,.2,1);text-align:center}
.overlay.show .reveal{transform:scale(1)}
.reveal img{width:min(450px,76vw);height:min(450px,58vh);object-fit:cover;border:3px solid var(--gold);box-shadow:0 18px 55px #000;border-radius:4px}
.reveal .emoji{font-size:42px;margin-top:10px}.reveal h2{font-size:clamp(30px,5vw,54px);margin:2px 0 8px}
.reveal p{font:15px Arial,sans-serif;color:#adb2bb;margin:0 auto 12px;max-width:600px}
.reveal .label{font:700 11px Arial,sans-serif;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.reveal-close{margin-top:16px;min-width:190px;padding:12px 24px;font:900 13px Arial,sans-serif;
letter-spacing:1px;border:1px solid #75602f;background:linear-gradient(135deg,#f5d77d,#b57a24);color:#171109;cursor:pointer}
.reveal-close:hover{filter:brightness(1.1);transform:translateY(-1px)}
.reveal.final{border-color:#e9ca74;box-shadow:0 0 80px #c99e4733,0 35px 100px #000}
.final-badge{display:none;color:#ffeaa4;font:900 14px Arial,sans-serif;letter-spacing:2px;margin-top:10px}.reveal.final .final-badge{display:block}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

<script>

/* ===== DIMANUS AUDIO ===== */
let soundEnabled = true;
let audioCtx = null;
let spinTimer = null;

function initAudio(){
  if(!soundEnabled) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  if(!audioCtx) audioCtx = new AC();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq=440, duration=.08, type='sine', volume=.035, delay=0){
  if(!soundEnabled) return;
  initAudio();
  if(!audioCtx) return;
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(volume,.0002),t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+duration);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+duration+.02);
}

function startWheelSound(){
  if(!soundEnabled) return;
  stopWheelSound();
  let delay=55;
  let running=true;
  function tick(){
    if(!running || !soundEnabled) return;
    tone(115+Math.random()*45,.028,'square',.018);
    delay=Math.min(190,delay*1.045);
    spinTimer=setTimeout(tick,delay);
  }
  spinTimer={stop:()=>{running=false;clearTimeout(spinTimer?.id)}};
  // Use a separate timeout id because the object above is used for stop.
  let id;
  function loop(){
    if(!running || !soundEnabled) return;
    tone(115+Math.random()*45,.028,'square',.018);
    delay=Math.min(190,delay*1.045);
    id=setTimeout(loop,delay);
    spinTimer.id=id;
  }
  clearTimeout(spinTimer.id);
  loop();
}

function stopWheelSound(){
  if(spinTimer){
    clearTimeout(spinTimer.id);
    if(spinTimer.stop) spinTimer.stop();
    spinTimer=null;
  }
}

function playSelectionSound(){
  if(!soundEnabled) return;
  tone(440,.08,'triangle',.04,0);
  tone(554,.10,'triangle',.045,.09);
  tone(659,.18,'triangle',.055,.19);
}

function playFinalFart(){
  if(!soundEnabled) return;
  initAudio();
  if(!audioCtx) return;
  const now=audioCtx.currentTime;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
  o.type='sawtooth';
  o.frequency.setValueAtTime(105,now);
  o.frequency.exponentialRampToValueAtTime(42,now+.52);
  f.type='lowpass';
  f.frequency.setValueAtTime(650,now);
  f.frequency.exponentialRampToValueAtTime(170,now+.55);
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.20,now+.025);
  g.gain.exponentialRampToValueAtTime(.0001,now+.58);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(now); o.stop(now+.6);
}

const TAU=Math.PI*2;
const canvas=document.getElementById('wheel');
const ctx=canvas.getContext('2d');
const spinBtn=document.getElementById('spin');
const resetBtn=document.getElementById('reset');
const countEl=document.getElementById('count');
const listEl=document.getElementById('list');
const overlay=document.getElementById('overlay');
const reveal=document.getElementById('reveal');
const toast=document.getElementById('toast');
let images=[];
let active=[];
let rotation=0;
let spinning=false;

PEOPLE.forEach((p,i)=>{const im=new Image();im.onload=()=>draw();im.src=p.img;images[i]=im;});
function resetGame(){
  active=PEOPLE.map((_,i)=>i);
  rotation=0; spinning=false;
  spinBtn.disabled=false;
  spinBtn.textContent='⚔ УБРАТЬ ОДНОГО';
  renderList(); updateCount(); draw();
}
function renderList(finalIndex=-1){
  listEl.innerHTML=PEOPLE.map((p,i)=>{
    const isActive=active.includes(i);
    const isFinal=i===finalIndex;
    return `<div class="card ${isActive?'':'out'} ${isFinal?'final':''}">
      <img src="${p.img}" alt="">
    </div>`;
  }).join('');
}
function updateCount(){countEl.textContent=active.length;}
function draw(){
  const r=450,cx=r,cy=r;
  ctx.clearRect(0,0,900,900);
  if(!active.length)return;
  const n=active.length,arc=TAU/n;
  active.forEach((idx,slot)=>{
    const a=rotation+slot*arc-Math.PI/2,mid=a+arc/2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-8,a,a+arc);ctx.closePath();
    const grad=ctx.createLinearGradient(0,0,900,900);
    grad.addColorStop(0,`hsl(${slot*360/n+255},35%,30%)`);
    grad.addColorStop(1,`hsl(${slot*360/n+255},30%,12%)`);
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle='#f0bd4e66';ctx.lineWidth=2.5;ctx.stroke();

    const ix=cx+Math.cos(mid)*302,iy=cy+Math.sin(mid)*302;
    const im=images[idx];
    ctx.save();ctx.beginPath();ctx.arc(ix,iy,58,0,TAU);ctx.clip();
    if(im.complete){
      const s=Math.max(116/im.width,116/im.height);
      ctx.drawImage(im,ix-im.width*s/2,iy-im.height*s/2,im.width*s,im.height*s);
    }
    ctx.restore();
    ctx.beginPath();ctx.arc(ix,iy,58,0,TAU);ctx.strokeStyle='#e4c873';ctx.lineWidth=3;ctx.stroke();

    ctx.save();ctx.translate(cx,cy);ctx.rotate(mid);
    ctx.textAlign='center';ctx.fillStyle='#eee';ctx.font='bold 14px Arial';
    ctx.fillText('•',0,-105);
    ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,54,0,TAU);ctx.fillStyle='#09090f';ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,54,0,TAU);ctx.strokeStyle='#f0bd4e';ctx.lineWidth=3;ctx.stroke();
}
function ease(t){return 1-Math.pow(1-t,4);}
function tone(freq,duration=.06){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!window.__ac)window.__ac=new AC();
    const ac=window.__ac,o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.035,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration);
  }catch(e){}
}
function toastMsg(t){
  toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200);
}
function revealPerson(idx,isFinal){
  const p=PEOPLE[idx];
  document.getElementById('revealImg').src=p.img;
  document.getElementById('revealEmoji').textContent=p.emoji;
  document.getElementById('revealName').textContent=p.name;
  document.getElementById('revealDesc').textContent=p.desc;
  document.getElementById('revealLabel').textContent=isFinal?'🏆 ТВОЙ ИТОГ':'❌ ВЫБЫВАЕТ';
  document.getElementById('revealClose').textContent=isFinal?'ЗАКРЫТЬ РЕЗУЛЬТАТ':'ПРОДОЛЖИТЬ';
  reveal.classList.toggle('final',isFinal);
  overlay.classList.add('show');
}
function hideReveal(){overlay.classList.remove('show');}
function confetti(){
  const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:220},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*18,vy:-Math.random()*14-4,g:.3,l:130+Math.random()*90,s:3+Math.random()*8,h:Math.random()*360}));
  function f(){x.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{if(p.l<=0)return;alive=true;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;x.globalAlpha=Math.min(1,p.l/40);x.fillStyle=`hsl(${p.h},90%,65%)`;x.fillRect(p.x,p.y,p.s,p.s*1.8)});if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)}
  f();
}
function spin(){
  if(spinning||active.length<=1)return;
  spinning=true;
  spinBtn.disabled=true;
  initAudio();
  startWheelSound();

  const n=active.length,slot=Math.floor(Math.random()*n),idx=active[slot],arc=TAU/n;
  const target=-slot*arc-arc/2;
  let delta=target-rotation;
  while(delta<Math.PI*10)delta+=TAU;
  const start=rotation,end=rotation+delta+TAU*(2+Math.floor(Math.random()*2));
  const duration=4300+Math.random()*800,t0=performance.now();

  function frame(now){
    const p=Math.min(1,(now-t0)/duration);
    rotation=start+(end-start)*ease(p);
    draw();

    if(p<1){requestAnimationFrame(frame);return;}

    stopWheelSound();
    rotation=((rotation%TAU)+TAU)%TAU;
    const lastRound=active.length===2;

    playSelectionSound();
    revealPerson(idx,false);

    const continueBtn=document.getElementById('revealClose');
    continueBtn.onclick=()=>{
      hideReveal();
      active=active.filter(i=>i!==idx);
      rotation=0;
      renderList();
      updateCount();
      draw();

      if(lastRound){
        const finalIndex=active[0];
        setTimeout(()=>{
          revealPerson(finalIndex,true);
          renderList(finalIndex);
          playFinalFart();
          toastMsg('🏆 Последний оставшийся — твой сегодняшний результат!');
          confetti();
          spinBtn.textContent='🏆 ИТОГ ОПРЕДЕЛЁН';
          spinBtn.disabled=true;
          spinning=false;
        },250);
      }else{
        spinBtn.disabled=false;
        spinning=false;
        toastMsg('❌ '+PEOPLE[idx].name+' выбыл');
      }
    };
  }
  requestAnimationFrame(frame);
}

spinBtn.addEventListener('click',()=>{initAudio();spin();});
resetBtn.addEventListener('click',()=>{hideReveal();resetGame();tone(260,.08);});

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();spin();}});
window.addEventListener('resize',draw);
resetGame();

const soundToggle=document.getElementById('soundToggle');
if(soundToggle){
  soundToggle.addEventListener('click',()=>{
    soundEnabled=!soundEnabled;
    soundToggle.textContent=soundEnabled?'🔊 ЗВУК ВКЛ':'🔇 ЗВУК ВЫКЛ';
    soundToggle.classList.toggle('off',!soundEnabled);
    if(soundEnabled) initAudio();
    else stopWheelSound();
  });
}

</script>
